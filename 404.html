<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Save the URL the user was trying to reach
      sessionStorage.redirect = location.href;
      // Send them back to the main homepage
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
